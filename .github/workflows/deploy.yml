name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - master # Deploy on either main or master

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'

      - name: Install dependencies
        run: npm ci
        working-directory: ./frontend

      - name: Build project
        # vite --base sets the base url to your repository name automatically for GitHub pages
        run: npm run build -- --base=/${{ github.event.repository.name }}/
        working-directory: ./frontend

      - name: SPA Routing Fix Configuration
        # Copies index.html to 404.html to support react-router-dom direct navigation
        run: cp dist/index.html dist/404.html
        working-directory: ./frontend

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v4

      - name: Upload Build Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './frontend/dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
